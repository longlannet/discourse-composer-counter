composer_counter_hide_when_sufficient:
  default: false
  description:
    en: "Hide the count once the required minimum length is reached."
    zh_CN: "达到最低长度后隐藏计数。"
composer_counter_show_title:
  default: true
  description:
    en: "Show character count for the composer title."
    zh_CN: "显示标题字符计数。"
composer_counter_show_body:
  default: true
  description:
    en: "Show character count for the composer body."
    zh_CN: "显示正文字符计数。"
composer_counter_template:
  default: "%{current} / %{minimum}"
  description:
    en: "Counter display template. Available placeholders: %{current}, %{minimum}, %{remaining}, %{count}. Example: %{current} / %{minimum} or %{remaining} characters remaining."
    zh_CN: "计数器显示模板。可用占位符：%{current}、%{minimum}、%{remaining}、%{count}。例如：%{current} / %{minimum} 或 还差 %{remaining} 个字符。"
